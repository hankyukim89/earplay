name: Deploy Earplay to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: earplay/package-lock.json
      - run: npm ci
        working-directory: earplay
      - run: npm run build
        working-directory: earplay
        env:
          PAGES_BASE: /earplay/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: earplay/dist/client
      - uses: actions/deploy-pages@v4
        id: deployment
